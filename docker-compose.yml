# Production topology: web + db + nginx, one VPS, ~$10/mo (spec §2/§13).
# Reviewed by eye at Phase 7 (fixed a missing POSTGRES_PASSWORD — see
# .env.example) but still not run for real: no Docker on this dev machine.
# Run `docker compose up` on the actual target host before relying on this.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: branchtasks
      POSTGRES_USER: branchtasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchtasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  static:
