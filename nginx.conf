# Minimal reverse proxy for the web service. Reviewed by eye at Phase 0,
# exercised for real at Phase 7 alongside the rest of docker-compose.yml.
server {
    listen 80;
    server_name _;

    client_max_body_size 12M;  # spec §3.4: 10 MB attachment cap + headroom

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
