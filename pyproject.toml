[project]
name = "branchtasks"
version = "0.1.0"
description = "Centralized task management and tracking system for a four-branch organization."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "django-simple-history>=3.7",
    "django-filter>=24.2",
    "psycopg[binary]>=3.1",
    "filetype>=1.2",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory_boy>=3.3",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.black]
line-length = 100
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "core", "accounts", "tasks", "notifications"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
