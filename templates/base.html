{% load i18n %}<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}ניהול משימות{% endblock %}</title>

    <!-- Tailwind Play CDN (dev only — Phase 7 swaps in a compiled build, per §2/§7 of the build spec). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Segoe UI', 'Arial', 'sans-serif'] },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <script src="//unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col" hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>
    <script>
        function getCookie(name) {
            const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return match ? match.pop() : '';
        }
        document.body.addEventListener('htmx:configRequest', function (evt) {
            evt.detail.headers['X-CSRFToken'] = getCookie('csrftoken');
        });
    </script>

    {% if user.is_authenticated %}
        {% include "partials/_header.html" %}
    {% endif %}

    <main class="flex-1 w-full max-w-3xl mx-auto px-3 py-4 sm:px-4">
        {% include "partials/_messages.html" %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
