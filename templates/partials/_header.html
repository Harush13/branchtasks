{% load perms %}<header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-3 sm:px-4 flex items-center justify-between h-14">
        <a href="{% url 'tasks:list' %}" class="font-bold text-lg text-blue-700 shrink-0">משימות</a>

        <nav class="flex-1 flex items-center gap-1 overflow-x-auto ps-3 text-sm">
            <a href="{% url 'tasks:list' %}"
               class="px-2 py-1 rounded-md whitespace-nowrap {% if request.resolver_match.url_name == 'list' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-gray-600{% endif %}">
                כל המשימות
            </a>
            <a href="{% url 'tasks:my_tasks' %}"
               class="px-2 py-1 rounded-md whitespace-nowrap {% if request.resolver_match.url_name == 'my_tasks' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-gray-600{% endif %}">
                המשימות שלי
            </a>
            {% if user|can_view_dashboard %}
            <a href="#" class="px-2 py-1 rounded-md whitespace-nowrap text-gray-400" title="בקרוב — שלב 6">
                לוח בקרה
            </a>
            {% endif %}
        </nav>

        <div class="flex items-center gap-2 shrink-0">
            <a href="{% url 'tasks:create' %}"
               class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-blue-600 text-white text-xl leading-none"
               title="משימה חדשה" aria-label="משימה חדשה">+</a>

            {% include "partials/_notification_bell.html" %}

            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open" @click.outside="open = false"
                        class="w-9 h-9 rounded-full bg-gray-200 text-gray-700 text-sm font-semibold flex items-center justify-center">
                    {{ user.full_name|default:user.username|slice:":1" }}
                </button>
                <div x-cloak x-show="open"
                     class="absolute end-0 mt-2 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 text-sm">
                    <div class="px-3 py-2 text-gray-500 border-b border-gray-100">
                        {{ user.full_name|default:user.username }}
                        <div class="text-xs text-gray-400">{{ user.get_role_display }}</div>
                    </div>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-start px-3 py-2 text-red-600 hover:bg-gray-50">
                            התנתקות
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
