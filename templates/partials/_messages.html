{% if messages %}
<ul class="space-y-2 mb-4">
    {% for message in messages %}
    <li class="rounded-lg px-3 py-2 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'success' %}bg-green-100 text-green-800{% else %}bg-blue-100 text-blue-800{% endif %}">
        {{ message }}
    </li>
    {% endfor %}
</ul>
{% endif %}
