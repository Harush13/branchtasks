<div x-data="{ open: false }" class="relative">
    <button @click="open = !open"
            hx-get="{% url 'notifications:dropdown' %}"
            hx-trigger="click once"
            hx-target="#notif-dropdown-content"
            class="relative w-9 h-9 rounded-full text-gray-600 flex items-center justify-center"
            aria-label="התראות">
        🔔
        <span id="notif-badge"
              class="absolute -top-0.5 -end-0.5 min-w-[1.1rem] h-[1.1rem] px-1 rounded-full bg-red-600 text-white text-[10px] leading-[1.1rem] text-center {% if unread_notification_count == 0 %}hidden{% endif %}">
            <span dir="ltr">{{ unread_notification_count }}</span>
        </span>
    </button>
    <div x-cloak x-show="open" @click.outside="open = false"
         class="absolute end-0 mt-2 w-72 max-w-[90vw] bg-white border border-gray-200 rounded-lg shadow-lg text-sm max-h-96 overflow-y-auto">
        <div id="notif-dropdown-content">
            <p class="p-4 text-gray-400 text-center">טוען...</p>
        </div>
    </div>
</div>
