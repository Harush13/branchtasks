{% extends "base.html" %}
{% block title %}משימה חדשה · ניהול משימות{% endblock %}
{% block content %}
<h1 class="text-lg font-bold mb-3">משימה חדשה</h1>

<form method="post" class="bg-white border border-gray-200 rounded-lg p-3 space-y-3">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %} *{% endif %}
        </label>
        {{ field }}
        {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
    </div>
    {% endfor %}

    <button type="submit" class="w-full bg-blue-600 text-white rounded-lg py-2.5 text-sm font-medium">
        צור משימה
    </button>
</form>
{% endblock %}
